[project]
name = "artham-partner"
version = "0.1.0"
description = "The Artham story-generation pipeline, built with Google ADK."
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.6.3",
    "google-genai>=2.18",
    "google-auth>=2.56",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.10",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["artham_partner"]
