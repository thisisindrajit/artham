[project]
name = "artham-backend"
version = "0.1.0"
description = "FastAPI backend for Artham."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.22,<1",
    "alembic>=1.17,<2",
    "asyncpg>=0.31,<1",
    "certifi>=2026.7.22",
    "fastapi[standard]>=0.115,<1",
    "google-cloud-storage>=3,<4",
    "pgvector>=0.4,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.46,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
